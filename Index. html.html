<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArmaPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#e7f0ea; --surface:#f7fbf8; --ink:#0d3430; --muted:#486863; --line:#b3cac1;
  --copper:#9a4f14; --copper-ink:#fff6ec; --mark:rgba(154,79,20,.13);
  --hw:#27312f; --hw2:#415250; --screen:#0f3d3a; --screen2:#2a7a70; --glow:#7be0c4;
  --wall:#dfece5; --desk:#b89a70; --desk2:#9c7f58; --danger:#a3281f; --ok:#1c6b3f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0a2724; --surface:#103632; --ink:#e6f1ec; --muted:#9bbab3; --line:#245049;
    --copper:#e2a35e; --copper-ink:#2a1405; --mark:rgba(226,163,94,.14);
    --hw:#2b3735; --hw2:#4a5d5a; --screen:#0b2f2c; --screen2:#2a7a70; --glow:#7be0c4;
    --wall:#0e2e2a; --desk:#6a5238; --desk2:#52402b; --danger:#ff8a80; --ok:#7be0a4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a2724; --surface:#103632; --ink:#e6f1ec; --muted:#9bbab3; --line:#245049;
  --copper:#e2a35e; --copper-ink:#2a1405; --mark:rgba(226,163,94,.14);
  --hw:#2b3735; --hw2:#4a5d5a; --screen:#0b2f2c; --screen2:#2a7a70; --glow:#7be0c4;
  --wall:#0e2e2a; --desk:#6a5238; --desk2:#52402b; --danger:#ff8a80; --ok:#7be0a4;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px; line-height:1.5; overflow:hidden;
}
h1,h2,h3,h4{font-family:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}

.traces{position:fixed;inset:0;width:100%;height:100%;color:var(--line);opacity:.7;pointer-events:none}

.viewport{position:fixed;inset:0;overflow:hidden}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.65,0,.25,1)}
.page{
  flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 110px);
}
#p0{position:relative}
.wrap{max-width:860px;margin:0 auto}
.page-head h2{font-size:clamp(2rem,6vw,3rem);font-weight:700}
.sub{color:var(--muted);margin:.5rem 0 0;max-width:56ch}

/* Botones */
.btn{
  border:2px solid var(--ink);background:transparent;border-radius:8px;
  padding:.65rem 1.1rem;cursor:pointer;font-weight:700;min-height:44px;
}
.btn.primary{background:var(--copper);border-color:var(--copper);color:var(--copper-ink)}
.btn.small{padding:.4rem .8rem;min-height:38px;font-size:.9rem;font-weight:500;border-width:1px;border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.07)}

/* Idioma */
.lang-btn{
  position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:2;
  display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--surface);
  border-radius:999px;padding:.35rem 1rem .35rem .6rem;min-height:46px;cursor:pointer;font-weight:700
}
.lang-btn svg{width:24px;height:24px;flex:none}

/* Inicio */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:56px 0 10px}
.logo{width:min(260px,62vw)}
.logo svg,.logo img{width:100%;height:auto;display:block}
.logo img{max-height:260px;object-fit:contain}
.tr path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease-out forwards}
.tr path:nth-child(3n+2){animation-delay:.15s}
.tr path:nth-child(3n){animation-delay:.3s}
.tr path:nth-child(n+7){animation-delay:.45s}
@keyframes draw{to{stroke-dashoffset:0}}
#brand{
  font-size:clamp(2.6rem,10vw,4.6rem);font-weight:700;letter-spacing:.01em;outline-offset:6px;
  border-radius:6px;padding:0 .2em;min-width:2ch;cursor:text;
}
.tag{font-size:1.15rem;color:var(--muted);max-width:30ch;margin:0}
.home .btn.primary{margin-top:8px;padding:.8rem 2.2rem;font-size:1.1rem}
.logo-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:10px;color:var(--muted);font-size:.9rem}

/* Cómo funciona */
.steps{list-style:none;margin:32px 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:21px;top:22px;bottom:34px;width:3px;background:var(--copper);opacity:.45;border-radius:2px}
.step{position:relative;padding:0 0 34px 66px}
.step:last-child{padding-bottom:0}
.step-n{
  position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:3px solid var(--copper);background:var(--bg);
  display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:1.15rem
}
.step:last-child .step-n{background:var(--copper);color:var(--copper-ink)}
.step h3{font-size:1.3rem;margin:4px 0 6px}
.step p{margin:0 0 10px;max-width:56ch}

/* Armar */
.scene-wrap{margin-top:22px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--wall)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation}
.slot{cursor:pointer}
.slot .ph{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 6;transition:stroke .2s}
.slot .lbl{fill:var(--muted);font-family:'Chakra Petch',sans-serif;font-size:15px;font-weight:500;text-anchor:middle;pointer-events:none}
.slot .art{opacity:0;transform:translateY(-14px);transition:opacity .35s,transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.slot .hit{fill:transparent}
.slot.on .art{opacity:1;transform:none}
.slot.on .ph,.slot.on .lbl{opacity:0}
.slot.target .ph{stroke:var(--copper);stroke-width:3;animation:pulse 1s ease-in-out infinite}
.slot.shake{animation:shake .4s}
@keyframes pulse{50%{stroke-opacity:.35}}
@keyframes shake{25%{transform:translate(var(--sx),var(--sy)) translateX(-6px)}75%{transform:translate(var(--sx),var(--sy)) translateX(6px)}}
.status{min-height:1.6em;margin:14px 0 0;font-weight:500}
.progress{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.progress strong{font-family:'Chakra Petch',sans-serif;font-size:1.25rem}
.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:12px}
.chip{
  border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 6px 8px;
  cursor:grab;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none;
}
.chip svg{width:100%;height:56px}
.chip span{font-weight:700;font-size:.95rem}
.chip small{color:var(--muted);font-size:.78rem;margin-top:-4px}
.chip.sel{border-color:var(--copper);box-shadow:0 0 0 3px var(--mark)}
.chip:disabled{opacity:.4;cursor:default}
.ghost{position:fixed;z-index:50;width:96px;pointer-events:none;transform:translate(-50%,-50%);opacity:.92;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.ghost svg{width:100%;height:auto}
.done{margin-top:16px;padding:14px 16px;border-left:6px solid var(--ok);background:var(--surface);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.done[hidden]{display:none}

/* Presupuesto */
.sec{border-top:2px solid var(--ink);margin-top:34px;padding-top:16px}
.sec h3{font-size:1.35rem;margin-bottom:6px}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 12px;max-width:60ch}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=text],input[type=number],select{
  background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:.5rem .6rem;min-height:44px;min-width:0
}
input:focus,select:focus{border-color:var(--copper)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cat{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 4px 2px 12px;font-weight:500}
.cat button{border:0;background:transparent;cursor:pointer;width:30px;height:30px;border-radius:50%;font-size:1.1rem;color:var(--muted)}
.cat button:hover{color:var(--danger)}
.row{display:grid;grid-template-columns:1fr 44px;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row .r-name{grid-column:1 / -1}
.money{display:flex;gap:6px}
.money input{flex:1;min-width:0}
.row .r-del{border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--muted);justify-self:end;width:44px;height:44px}
.row .r-del:hover{color:var(--danger)}
.row .r-eq{grid-column:1 / -1;color:var(--muted);font-size:.88rem;min-height:1.2em}
.empty{color:var(--muted);padding:14px 0}
.cat-totals{margin:0;padding:0;list-style:none}
.cat-totals li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted var(--line)}
.grand{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.grand div{background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:8px}
.grand small{display:block;opacity:.8}
.grand b{font-family:'Chakra Petch',sans-serif;font-size:clamp(1.2rem,4.6vw,1.9rem);overflow-wrap:anywhere}
.note{color:var(--danger);font-weight:500;margin:10px 0 0;min-height:1.4em}
.qr-box{margin-top:16px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.qr-slot{
  width:230px;height:230px;border:2px dashed var(--muted);border-radius:6px;display:grid;place-items:center;
  text-align:center;color:var(--muted);padding:10px;background:transparent
}
.qr-slot.filled{border:2px solid var(--ink);background:#fff;padding:12px}
.qr-slot img{max-width:100%;max-height:100%;display:block}
.qr-slot canvas{display:none}
.qr-controls{display:flex;flex-direction:column;gap:10px;flex:1;min-width:230px}

/* Barra lateral de componentes */
.comp-layout{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:start;margin-top:8px}
.rail{
  position:sticky;top:8px;display:flex;flex-direction:column;gap:6px;padding:6px;
  border:2px solid var(--ink);border-radius:10px;background:var(--surface)
}
.rail-btn{
  text-align:left;border:0;border-left:5px solid transparent;background:transparent;border-radius:6px;
  padding:9px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:56px
}
.rail-btn .rn{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:.95rem;line-height:1.15}
.rail-btn .rp{font-size:.74rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.2}
.rail-btn:hover{background:var(--mark)}
.rail-btn[aria-pressed="true"]{border-left-color:var(--copper);background:var(--mark)}
.rail-btn[aria-pressed="true"] .rp{color:var(--ink)}
.comp-empty{color:var(--muted);margin:10px 0;padding:18px 14px;border:2px dashed var(--line);border-radius:8px}
.comp-panel h4{font-size:1.4rem}
.comp-panel .mark{margin-top:34px}
.comp-panel .mark:first-of-type{margin-top:30px}

.mark{
  position:relative;padding:22px 14px 16px;
  border:2px dashed var(--copper);background:var(--mark);border-radius:4px;
}
.mark::before,.mark::after{content:"";position:absolute;width:22px;height:22px;border:4px solid var(--copper)}
.mark::before{left:-4px;bottom:-4px;border-top:0;border-right:0}
.mark::after{right:-4px;bottom:-4px;border-top:0;border-left:0}
.mark-tag{
  position:absolute;top:-16px;left:12px;background:var(--copper);color:var(--copper-ink);
  font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:4px;
}
.mark.off{border-color:transparent;background:transparent}
.mark.off::before,.mark.off::after,.mark.off .mark-tag{display:none}
.mark.pulse{animation:markpulse .9s ease-out 2}
@keyframes markpulse{0%{box-shadow:0 0 0 0 var(--copper)}100%{box-shadow:0 0 0 14px transparent}}
#compInfo{white-space:pre-wrap;min-height:6.5em;outline-offset:6px;cursor:text;font-size:1rem}
#compInfo:empty::before{content:attr(data-ph);color:var(--muted)}
.mark-actions{display:flex;justify-content:flex-end;margin-top:12px}

.car-wrap{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:6px;background:var(--surface)}
.car::-webkit-scrollbar{display:none}
.slide{
  flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;display:grid;place-items:center;text-align:center;
  color:var(--muted);padding:8px
}
.slide.ph{border:2px solid var(--line);border-radius:6px}
.slide.ph svg{width:44px;height:44px;margin:0 auto 4px;display:block}
.slide b{display:block;color:var(--ink);font-family:'Chakra Petch',sans-serif}
.slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.car-btn{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0
}
.car-btn svg{width:20px;height:20px}
.car-btn.l{left:6px}.car-btn.r{right:6px}
.car-dots{display:flex;justify-content:center;gap:2px;margin-top:6px}
.car-dots button{width:24px;height:24px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.car-dots button::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.car-dots button[aria-current="true"]::after{background:var(--copper)}
.car-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.comp-price{margin-top:22px}
.comp-price label{font-weight:700;display:block}
.comp-price .money{margin-top:6px}
.comp-price small{display:block;color:var(--muted);min-height:1.3em;margin-top:4px}

/* Pestaña Presupuesto */
.slide{cursor:pointer}
.rail-btn.bud{border-top:2px solid var(--line);border-radius:0 0 6px 6px;margin-top:4px}
.rail-btn.bud .rp{color:var(--ink);font-weight:700}
.qr-slot[hidden]{display:none}
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(5,25,22,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:620px;max-height:88dvh;display:flex;flex-direction:column;
  background:var(--bg);border-top:4px solid var(--copper);border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;
  transition:transform .4s cubic-bezier(.3,.9,.3,1),visibility 0s .4s}
.sheet.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.3,.9,.3,1),visibility 0s}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.sheet-head h3{font-size:1.6rem}
.sheet-x{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);font-size:1.5rem;line-height:1;cursor:pointer}
.sheet-body{overflow-y:auto;padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.bsteps{list-style:none;margin:0 0 10px;padding:0;position:relative}
.bsteps::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:3px;background:var(--copper);opacity:.4}
.bstep{position:relative;padding:0 0 16px 54px;min-height:36px}
.bstep .step-n{width:36px;height:36px;font-size:1rem;border-width:2px}
.bstep.ok .step-n{background:var(--copper);color:var(--copper-ink)}
.bstep.warn .step-n{border-color:var(--danger);color:var(--danger)}
.bs-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bs-add{font-weight:700;font-family:'Chakra Petch',sans-serif}
.bstep.warn .bs-add{color:var(--danger);font-weight:500;font-family:inherit}
.bs-sub{color:var(--muted);font-size:.9rem}
.bsteps.reveal .bstep{animation:stepin .4s both;animation-delay:calc(var(--i)*.14s + .2s)}
@keyframes stepin{from{opacity:0;transform:translateY(10px)}}
.total-card{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:var(--ink);color:var(--bg);padding:14px 16px;cursor:default}
.total-card small{display:block;opacity:.8}
.total-card b{display:block;font-family:'Chakra Petch',sans-serif;font-size:1.9rem}
.total-card span{display:block;margin-top:2px}
.total-card.ready{background:var(--copper);color:var(--copper-ink);cursor:pointer}
#qrAct{margin-top:12px}
#qrSlot{margin:14px auto 0}
/* Presupuesto por imágenes */
.slide.prod{aspect-ratio:auto;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px;background:var(--surface)}
.slide.prod svg{width:62%;max-width:190px;height:auto}
.slide .pn{font-weight:700;color:var(--ink);text-align:center}
.slide .pp{font-family:'Chakra Petch',sans-serif;font-size:1.4rem;color:var(--copper);font-weight:700}
.slide .pt{font-size:.85rem;color:var(--muted)}
.slide.flash{animation:flash .45s}
@keyframes flash{from{background:var(--mark);transform:scale(.97)}}
.prog{display:block;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--copper);transition:width .4s}
.prog.done i{background:var(--ok)}
.bar{position:sticky;top:0;z-index:5;margin-top:14px;background:var(--bg);padding:8px 0 10px}
.bar button{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:10px;background:var(--surface);padding:8px 12px;cursor:pointer}
.bar .bt{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-family:'Chakra Petch',sans-serif}
.bar small{display:block;color:var(--muted);margin-top:4px;min-height:1.2em}
.rate{margin:6px 0 0}
.rate small{color:var(--muted)}
.pmsg{font-weight:500;min-height:1.4em;margin:8px 0 12px}
.bs-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rm{min-width:44px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* Página del presupuesto compartido */
#qrSlot{width:min(364px,100%);height:auto;aspect-ratio:1}
#qrOpen a{color:var(--copper);font-weight:700}
.view{position:fixed;inset:0;z-index:30;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.view .bsteps{margin-top:24px}
#vQr{width:min(290px,100%);height:auto;aspect-ratio:1;margin:18px auto 0}
/* Información y ejemplos de componentes */
#compInfo{white-space:normal;cursor:auto;min-height:0}
#compInfo h5{font-family:'Chakra Petch',sans-serif;font-size:1.05rem;margin:14px 0 2px;color:var(--copper)}
#compInfo h5:first-child{margin-top:0}
#compInfo p{margin:0}
.fpst{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:.9rem}
.fpst th,.fpst td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}
.fpst th:first-child,.fpst td:first-child{text-align:left}
.slide.prod{min-height:300px}
.slide .tier{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--copper);color:var(--copper);margin-top:2px}
.slide .tier.t2{background:var(--copper);color:var(--copper-ink)}
.slide .det{font-size:.85rem;color:var(--muted);text-align:center}
.slide .fps{font-size:.85rem;font-weight:700;color:var(--ink);text-align:center}
.rail{top:96px}
@media (max-width:679px){.rail{position:static}}
/* Navegación */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.arrow{
  width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;flex:none

});
function updateNav(){
  $('#navTitle').textContent=t('p'+cur);
  [...dots.children].forEach((d,k)=>{ d.setAttribute('aria-label',t('goTo',{n:t('p'+k)})); d.setAttribute('aria-current',k===cur?'true':'false'); });

function go(i){
  i=Math.max(0,Math.min(pages.length-1,i)); cur=i;
  track.style.transform='translateX('+(-i*100)+'%)';
  pages.forEach((p,k)=>{ if(k===i) p.removeAttribute('inert'); else p.setAttribute('inert',''); p.setAttribute('aria-hidden',k===i?'false':'true'); });
  updateNav();
  $('#prev').disabled=i===0; $('#next').disabled=i===pages.length-1;
  pages[i].scrollTop=0;
  
}

/* ---------- Utilidades ---------- */
function plainPaste(el){
  el.addEventListener('paste',e=>{
    e.preventDefault();
    const tx=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText',false,tx);
  });
}
function readImage(file,max,cb,type){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const x=c.getContext('2d');
      if(type==='image/jpeg'){ x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); }
      x.drawImage(img,0,0,c.width,c.height);
      cb(type==='image/jpeg'?c.toDataURL('image/jpeg',.82):c.toDataURL('image/png'));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

function say(k,v){ statusKey=k?{k,v}:null; statusEl.textContent=k?t(k,v):''; }
function renderBuild(){
  let n=0;
  PARTS.forEach(p=>{
    const on=!!S.placed[p.id]; if(on) n++;
    const g=slotsG.querySelector('[data-id="'+p.id+'"]');
    g.classList.toggle('on',on);
    g.classList.toggle('target',sel===p.id && !on);
    g.querySelector('.lbl').textContent=p.name[L];
    g.setAttribute('aria-label', on ? t('slotOn',{name:p.name[L]}) : t('slotOff',{low:p.low[L]}));
    const c=palette.querySelector('[data-id="'+p.id+'"]');
    c.disabled=on; c.classList.toggle('sel',sel===p.id);
    c.querySelector('span').textContent=p.name[L];
    c.querySelector('small').textContent=on?t('chipDone'):'\u00A0';
  });
  $('#count').textContent=t('count',{n:n,m:PARTS.length});
  $('#done').hidden = n!==PARTS.length;
  if(statusKey) statusEl.textContent=t(statusKey.k,statusKey.v);
}
function shake(id){
  const g=slotsG.querySelector('[data-id="'+id+'"]');
  g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake');
  setTimeout(()=>g.classList.remove('shake'),450);
}
function place(partId,slotId){
  const p=P(partId), s=P(slotId);
  if(partId!==slotId){ shake(slotId); say('mWrong',{sart:art(s),slow:s.low[L],part:art(p),plow:p.low[L]}); return; }
  S.placed[partId]=true; sel=null; save(); say('mPlaced',{art:art(p),low:p.low[L]}); renderBuild();
}
function selectPart(id){
  sel = sel===id ? null : id;
  if(sel){ const p=P(sel); say('mPicked',{art:art(p),low:p.low[L]}); } else say(null);
  renderBuild();
}
slotsG.addEventListener('click',e=>{
  const g=e.target.closest('.slot'); if(!g) return;
  const id=g.dataset.id;
  if(S.placed[id]){ delete S.placed[id]; save(); const p=P(id); say('mRemoved',{art:art(p),low:p.low[L]}); renderBuild(); return; }

palette.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.chip'); if(!b||b.disabled) return;
  drag={id:b.dataset.id,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,pid:e.pointerId};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){
    drag.moved=true;
    const gh=document.createElement('div'); gh.className='ghost';
    gh.innerHTML=palette.querySelector('[data-id="'+drag.id+'"] svg').outerHTML;
    document.body.append(gh); drag.ghost=gh;
    sel=drag.id; renderBuild();
  }
  if(drag.ghost){ drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px'; }
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid) return;
  const d=drag; drag=null;
  if(d.ghost) d.ghost.remove();
  if(d.moved){
    if(!cancel){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const g=el&&el.closest&&el.closest('.slot');
      if(g) place(d.id,g.dataset.id); else { sel=null; say('mMiss'); renderBuild(); }
    } else { sel=null; renderBuild(); }
  } else if(!cancel){ selectPart(d.id); }
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

 mb:{es:['La placa madre es la placa de circuitos principal de la PC. En ella se conectan el procesador, la memoria RAM, la placa de video, los discos y la fuente de poder.','Sirve para que todas las piezas se comuniquen entre sí y reciban energía. Además define qué procesador, qué memoria y cuántos discos y puertos podés usar.','Tiene un socket donde va el procesador, ranuras para la memoria y una ranura PCIe para la placa de video. Su chipset y sus circuitos reparten datos y energía entre las piezas, y el BIOS enciende y revisa todo cada vez que arrancás la PC.','Gama baja: lo justo para una PC moderna, con menos conexiones. Gama media: buen equilibrio, con más puertos y mejor alimentación para el procesador. Gama alta: más conectividad (por ejemplo USB4, más ranuras M.2 y Wi-Fi 7) y componentes de energía más robustos, pensada para procesadores potentes.'],

compInfo.addEventListener('input',()=>{

  if(compInfo.innerText.trim()===''){ compInfo.innerHTML=''; }
  (S.comp[selComp]||(S.comp[selComp]={})).info=compInfo.innerText; save();
});
$('#markToggle').addEventListener('click',()=>{ S.hideMark=!S.hideMark; save(); renderMarks(); });

/* Carrusel: cada imagen suma su precio al presupuesto */
const car=$('#car'), carDots=$('#carDots');
const curSlide=()=>car.clientWidth?Math.round(car.scrollLeft/car.clientWidth):0;
function renderCar(goTo){
  if(!selComp) return;
  car.innerHTML=''; carDots.innerHTML='';
  EX[selComp].forEach((pr,i)=>{
    const s=document.createElement('div');
    s.className='slide prod'; s.tabIndex=0; s.setAttribute('role','button'); s.dataset.k=selComp+':'+i;
    s.setAttribute('aria-label',t('slideAria',{name:pr[L],price:usd(pr.p)}));
    s.innerHTML='<svg viewBox="0 0 160 100" aria-hidden="true">'+ART[selComp]+'</svg><div class="tier t'+pr.t+'">'+esc(t('tier'+pr.t))+'</div><div class="pn">'+esc(pr[L])+'</div><div class="det">'+esc(pr.d[L])+'</div>'+(pr.fps?'<div class="fps">'+esc(t('fpsLine',{a:pr.fps[0],b:pr.fps[1],c:pr.fps[2]}))+'</div>':'')+'<div class="pp">'+esc(usd(pr.p))+'</div><div class="pt">'+esc(t('tapAdd'))+'</div>';
    car.append(s);
    const d=document.createElement('button'); d.type='button'; d.setAttribute('aria-label',pr[L]);
    d.addEventListener('click',()=>goSlide(i)); carDots.append(d);
  });
  if(goTo!==undefined) car.scrollLeft=goTo*car.clientWidth;
  updateCar();
}
function updateCar(){ const idx=curSlide(); [...carDots.children].forEach((d,k)=>d.setAttribute('aria-current',k===idx?'true':'false')); }
function goSlide(i){ car.scrollTo({left:i*car.clientWidth,behavior:reduceMotion?'auto':'smooth'}); }
let raf=0;
car.addEventListener('scroll',()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(updateCar); });
$('#carPrev').addEventListener('click',()=>goSlide(Math.max(0,curSlide()-1)));
$('#carNext').addEventListener('click',()=>goSlide(Math.min(2,curSlide()+1)));
function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
car.addEventListener('click',e=>{ const s=e.target.closest('.slide'); if(s){ addProd(s.dataset.k); flash(s); } });
car.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ e.preventDefault(); goSlide(Math.min(2,curSlide()+1)); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goSlide(Math.max(0,curSlide()-1)); }
  else if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('slide')){ e.preventDefault(); addProd(e.target.dataset.k); flash(e.target); }
});

/* ---------- Pestaña Presupuesto ---------- */
const sheet=$('#sheet'), sheetBack=$('#sheetBack');
let sheetOpen=false, lastFocus=null, qrOn=false, qrSig=null;
function renderRate(){
  const h='<b>'+esc(t('rateEq',{r:nf.format(RATE)}))+'</b><br><small>'+esc(t('rateInfo',{d:RATE_DATE}))+'</small>';
  $('#rateLine').innerHTML=h; $('#rateLine2').innerHTML=h;
}
function addProd(k){
  const x=S.cart.find(y=>y.k===k); if(x) x.q++; else S.cart.push({k:k,q:1});
  lastMsg={name:prod(k)[L]}; save(); renderBudget();
}
const FORM={base:'https://docs.google.com/forms/d/e/1FAIpQLSeHtq_KMOginF8_bR2-wU36xCQZzB3w9RfXmQdDtVKCnG6ZYQ/viewform',prod:'entry.1411983233',usd:'entry.1937976366',ars:'entry.1084616919'};
function formURL(B){
  const lines=[];
  B.items.forEach(x=>lines.push(x.comp+': '+x.name+' x'+x.q+' = '+usd(x.sub)));
  const e=v=>encodeURIComponent(v).replace(/%20/g,'+');
  const q=['usp=pp_url',FORM.prod+'='+e(lines.join('\n'))];
  if(FORM.usd) q.push(FORM.usd+'='+e(usd(B.total)));
  if(FORM.ars) q.push(FORM.ars+'='+e(ars(B.total*RATE)));
  return FORM.base+'?'+q.join('&');
}
function budgetText(B){ return (FORM.base&&FORM.prod)?formURL(B):budgetPlain(B); }
function budgetPlain(B){
  const lines=[(S.brand||'ArmaPC')+' - '+t('sheetTitle')+' '+new Date().toISOString().slice(0,10)];
  B.items.forEach(x=>lines.push(x.comp+': '+x.name+' x'+x.q+' = '+usd(x.sub)));
  lines.push(t('qrTotal')+': '+usd(B.total)+' (~ '+ars(B.total*RATE)+')');
  lines.push(t('rateEq',{r:nf.format(RATE)}));
  if(B.tg) lines.push(t('viewTarget',{x:usd(B.tg)}));
  return lines.join('\n');
}
function drawBig(slot,text){
  if(!window.QRCode){ slot.textContent=t('qrNoLib'); return; }
  const d=document.createElement('div'); slot.append(d);
  try{ new QRCode(d,{text:text,width:340,height:340,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L}); }
  catch(e){ d.textContent=t('qrLong'); }
}
const pctOf=B=>B.tg?Math.min(100,B.total/B.tg*100):0;
const isDone=B=>B.tg>0&&B.total>=B.tg;
function msgFor(B){
  if(!B.tg) return '';
  if(B.total<B.tg) return t('missingMsg',{x:usd(B.tg-B.total)});
  const o=B.total-B.tg; return t('reached')+(o>0.005?' '+t('overMsg',{x:usd(o)}):'');
}
function renderBar(){
  const B=budget(), done=isDone(B);
  $('#barTot').textContent=usd(B.total); $('#barOf').textContent=t('ofTarget',{x:usd(B.tg)});
  $('#barFill').style.width=pctOf(B)+'%'; $('#barProg').classList.toggle('done',done);
  $('#barMsg').textContent=done?t('reached'):(lastMsg?t('added',lastMsg):t('barHint'));
}
function renderSheet(){
  const B=budget(), done=isDone(B);
  $('#sFill').style.width=pctOf(B)+'%'; $('#sProg').classList.toggle('done',done);
  $('#sMsg').textContent=msgFor(B);
  $('#bEmpty').hidden=B.items.length>0;
  $('#bSteps').innerHTML=B.items.map((x,i)=>'<li class="bstep ok" style="--i:'+i+'"><span class="step-n" aria-hidden="true">'+(i+1)+'</span><div class="bs-top"><b>'+esc(x.name)+'</b><span class="bs-add">+ '+esc(usd(x.sub))+'</span></div><div class="bs-row"><span class="bs-sub">'+esc(x.comp+', '+x.q+' × '+usd(x.unit)+'. '+t('stepSub',{x:usd(x.run)}))+'</span><button class="btn small rm" type="button" data-k="'+esc(x.k)+'" aria-label="'+esc(t('removeOne')+': '+x.name)+'">−</button></div></li>').join('');
  $('#sheetTotal').textContent=usd(B.total); $('#totalArs').textContent=t('totalArs',{x:ars(B.total*RATE)});
  $('#totalCard').classList.toggle('ready',done);
  $('#qrGen').disabled=!B.items.length; $('#clearAll').disabled=!B.items.length;
  if(!B.items.length) qrOn=false;
  drawQR(B);
}
function drawQR(B){
  const slot=$('#qrSlot'), cap=$('#qrCap'), open=$('#qrOpen');
  if(!qrOn||!B.items.length){ slot.hidden=true; cap.hidden=true; open.hidden=true; qrSig=null; return; }
  slot.hidden=false; cap.hidden=false; open.hidden=false;
  const text=budgetText(B);
  if(text===qrSig) return;
  qrSig=text; slot.innerHTML=''; slot.classList.add('filled'); drawBig(slot,text); return;
  if(window.QRCode){
    const d=document.createElement('div'); slot.append(d);
    try{ new QRCode(d,{text:text,width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L}); }
    catch(e){ d.textContent=t('qrLong'); }
  } else slot.textContent=t('qrNoLib');
}
function renderBudget(){ renderRail(); renderBar(); if(sheetOpen) renderSheet(); }
function openSheet(){
  if(sheetOpen) return; sheetOpen=true; lastFocus=document.activeElement;
  $('.viewport').inert=true; $('.nav').inert=true;
  sheet.removeAttribute('inert'); sheet.classList.add('open'); sheetBack.classList.add('open');
  const ol=$('#bSteps'); ol.classList.add('reveal'); setTimeout(()=>ol.classList.remove('reveal'),1800);
  renderSheet(); $('#sheetClose').focus();
}
function closeSheet(){
  if(!sheetOpen) return; sheetOpen=false;
  sheet.classList.remove('open'); sheetBack.classList.remove('open'); sheet.setAttribute('inert','');
  $('.viewport').inert=false; $('.nav').inert=false;
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
$('#sheetClose').addEventListener('click',closeSheet);
sheetBack.addEventListener('click',closeSheet);
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
$('#barBtn').addEventListener('click',openSheet);
$('#target').value=S.target;
$('#target').addEventListener('input',e=>{ S.target=e.target.value; save(); renderBar(); renderSheet(); });
$('#qrGen').addEventListener('click',()=>{ qrOn=true; renderSheet(); $('#qrSlot').scrollIntoView({block:'nearest'}); });
$('#clearAll').addEventListener('click',()=>{ S.cart=[]; lastMsg=null; save(); renderBudget(); });
$('#bSteps').addEventListener('click',e=>{
  const b=e.target.closest('.rm'); if(!b) return;
  const x=S.cart.find(y=>y.k===b.dataset.k); if(!x) return;
  x.q--; if(x.q<=0) S.cart=S.cart.filter(y=>y!==x);
  save(); renderBudget();
});

/* ---------- Página del presupuesto (se abre al escanear el QR) ---------- */
const SHARE_URL='https://claude.ai/artifact/CN6jb1NWmjoa2wbaG9jxak';
let VIEW=null, vSig=null;
function setLocale(l){ L=l; nf=new Intl.NumberFormat(L==='en'?'en-US':'es-AR',{maximumFractionDigits:2}); }
function buildShare(cart,tg,rate,lang,date,name,parts){
  const p='b='+cart.map(x=>x.k+':'+x.q).join(',')+'&t='+(tg||0)+'&r='+rate+'&l='+lang+'&d='+date+'&n='+encodeURIComponent((name||'ArmaPC').slice(0,40))+'&p='+(parts||[]).join(',');
  return SHARE_URL+'?'+p+'#'+p;
}
function shareURL(B){ return buildShare(S.cart,B.tg,RATE,L,new Date().toISOString().slice(0,10),S.brand,PARTS.filter(p=>S.placed[p.id]).map(p=>p.id)); }
function makeQR(slot,text){
  slot.innerHTML='';
  if(window.QRCode){
    const d=document.createElement('div'); slot.append(d);
    try{ new QRCode(d,{text:text,width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L}); }
    catch(e){ d.textContent=t('qrLong'); }
  } else slot.textContent=t('qrNoLib');
}
function readShared(){
  const q=new URLSearchParams(location.search), h=new URLSearchParams((location.hash||'').replace(/^#/,''));
  let rq=new URLSearchParams(), rh=new URLSearchParams();
  try{ const u=new URL(document.referrer); if(/(^|\.)claude\.ai$/.test(u.hostname)){ rq=u.searchParams; rh=new URLSearchParams(u.hash.replace(/^#/,'')); } }catch(e){}
  const g=k=>q.get(k)||h.get(k)||rq.get(k)||rh.get(k);
  const b=g('b'); if(b===null||b==='') return null;
  const items=[];
  b.split(',').forEach(x=>{ const a=x.split(':'), n=Math.floor(+a[2]); if(EX[a[0]]&&EX[a[0]][+a[1]]&&n>0&&n<100) items.push({k:a[0]+':'+(+a[1]),q:n}); });
  const r=parseFloat(g('r'));
  return {items:items,tg:Math.max(0,parseFloat(g('t'))||0),rate:r>0?r:RATE,name:(g('n')||'').slice(0,40),date:(g('d')||'').slice(0,10),lang:g('l')==='en'?'en':'es',parts:(g('p')||'').split(',').filter(id=>PARTS.some(p=>p.id===id))};
}
function renderView(){
  const B=budgetOf(VIEW.items,VIEW.tg), done=B.tg>0&&B.total>=B.tg;
  document.title=(VIEW.name||'ArmaPC')+' - '+t('sheetTitle');
  $('#vBrand').textContent=VIEW.name||'ArmaPC';
  $('#vSub').textContent=t('viewSub')+(VIEW.date?' ('+VIEW.date+')':'');
  $('#vEmpty').hidden=B.items.length>0||VIEW.parts.length>0;
  $('#vSceneWrap').hidden=!VIEW.parts.length; $('#vParts').hidden=!VIEW.parts.length;
  $('#vScene').innerHTML='<rect width="620" height="360" fill="var(--wall)"/><rect y="250" width="620" height="110" fill="var(--desk)"/><rect y="250" width="620" height="9" fill="var(--desk2)"/>'+VIEW.parts.map(id=>{ const p=P(id); return '<g transform="translate('+p.x+' '+p.y+')">'+p.art()+'</g>'; }).join('');
  $('#vParts').textContent=t('viewParts',{list:VIEW.parts.map(id=>P(id).name[L]).join(', ')});
  $('#vSteps').innerHTML=B.items.map((x,i)=>'<li class="bstep ok" style="--i:'+i+'"><span class="step-n" aria-hidden="true">'+(i+1)+'</span><div class="bs-top"><b>'+esc(x.name)+'</b><span class="bs-add">+ '+esc(usd(x.sub))+'</span></div><div class="bs-sub">'+esc(x.comp+', '+x.q+' × '+usd(x.unit)+'. '+t('stepSub',{x:usd(x.run)}))+'</div></li>').join('');
  $('#vTotal').className='total-card'+(done?' ready':'');
  $('#vTotal').innerHTML='<small>'+esc(t('sheetTotal'))+'</small><b>'+esc(usd(B.total))+'</b><span>'+esc(t('totalArs',{x:ars(B.total*VIEW.rate)}))+'</span>';
  $('#vProg').style.display=B.tg?'':'none'; $('#vProg').classList.toggle('done',done); $('#vFill').style.width=pctOf(B)+'%';
  $('#vMsg').textContent=B.tg?t('viewTarget',{x:usd(B.tg)})+'. '+msgFor(B):'';
  $('#vRate').innerHTML='<small>'+esc(t('rateEq',{r:nf.format(VIEW.rate)}))+'</small>';
  $('#vLang').textContent=t('langLabel');
  const has=B.items.length>0; $('#vQr').hidden=!has; $('#vQrCap').hidden=!has;
  if(has){ const u=buildShare(VIEW.items,VIEW.tg,VIEW.rate,L,VIEW.date,VIEW.name,VIEW.parts); if(u!==vSig){ vSig=u; makeQR($('#vQr'),u); } }
}
function enterView(sh){
  VIEW=sh; setLocale(sh.lang); applyI18n();
  $('.viewport').style.display='none'; $('.nav').style.display='none'; $('#view').hidden=false;
  renderView();
}
$('#vLang').addEventListener('click',()=>{ setLocale(L==='es'?'en':'es'); applyI18n(); renderView(); });
$('#vOwn').addEventListener('click',()=>{
  VIEW=null; $('#view').hidden=true; $('.viewport').style.display=''; $('.nav').style.display='';
  setLocale(S.lang==='en'?'en':'es'); applyI18n(); document.title=S.brand||'ArmaPC'; renderAll();
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
});

/* ---------- Inicio ---------- */
function renderAll(){
  updateNav(); renderLogo(); renderBuild(); renderRail(); renderComp(false); renderBudget(); renderRate();
}
translateStored();
applyI18n();
renderAll();
go(0);
const SH=readShared(); if(SH) enterView(SH);
})();
</script>
